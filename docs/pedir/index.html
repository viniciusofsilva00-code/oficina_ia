<style>
/* layout: uma coluna estreita, pensada para o polegar no celular */
.col{max-width:40rem;margin:0 auto}
.passo-form{display:grid;gap:8px;margin:0 0 22px}
.passo-form > label,.passo-form > .rot{font:600 1.05rem/1.3 var(--display);letter-spacing:-.01em}
.passo-form .dica{font-size:.9rem;color:var(--muted);margin:0}
.campo{width:100%;font:400 1rem/1.5 var(--sans);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
textarea.campo{min-height:96px;resize:vertical}
.campo:focus{outline:2px solid var(--neon-strong);outline-offset:1px}
.n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--fg);color:var(--bg);font:700 .75rem/1 var(--mono);margin-right:8px;vertical-align:2px}
.solta{display:grid;place-items:center;gap:6px;text-align:center;padding:26px 16px;border:1.5px dashed var(--muted);border-radius:14px;background:var(--surface);cursor:pointer;font:600 1rem/1.3 var(--display)}
.solta:hover,.solta:focus-within{border-color:var(--neon-strong);box-shadow:var(--glow)}
.solta small{font:400 .85rem/1.4 var(--sans);color:var(--muted)}
.solta input{position:absolute;width:1px;height:1px;opacity:0}
.miniaturas{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.miniaturas figure{position:relative;margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:var(--bg)}
.miniaturas img{width:100%;height:100%;object-fit:cover;display:block}
.miniaturas button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:8px;border:0;background:var(--inverse-bg);color:var(--inverse-fg);font:700 .9rem/1 var(--mono);cursor:pointer}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcoes label{position:relative}
.opcoes input{position:absolute;opacity:0;inset:0}
.opcoes span{display:inline-block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:500 .9rem/1.2 var(--sans);cursor:pointer}
.opcoes input:checked + span{background:var(--fg);color:var(--bg);border-color:transparent}
.opcoes input:focus-visible + span{outline:2px solid var(--neon-strong);outline-offset:2px}
.enviar{width:100%;justify-content:center;padding:16px;font-size:1rem}
.progresso{font:500 .85rem/1.4 var(--mono);color:var(--muted);min-height:1.4em;margin-top:10px}
.erro-msg{background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.pedidos{display:grid;gap:10px}
.pedido{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-decoration:none;color:inherit;padding:14px 16px}
.pedido h3{margin:0;font-size:1.02rem}
.pedido .meta{font:500 .75rem/1.4 var(--mono);color:var(--muted)}
.estado{font:600 .72rem/1 var(--mono);padding:6px 8px;border-radius:6px;white-space:nowrap}
.e-pronto{background:var(--ok-soft);color:var(--ok)} .e-gerando,.e-fila{background:var(--warn-soft);color:var(--warn)}
.e-perguntas{background:var(--neon-soft);color:var(--fg)} .e-erro,.e-falha{background:var(--bad-soft);color:var(--bad)}
.linha-tempo{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.linha-tempo li{padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line);max-width:none;font-size:.95rem}
.linha-tempo li.eu{background:var(--surface)}
.linha-tempo .quem{display:block;font:500 .72rem/1.4 var(--mono);color:var(--muted);margin-bottom:4px}
.pulso{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--neon);margin-right:8px;animation:pulso 1.2s ease-in-out infinite}
@keyframes pulso{50%{opacity:.25}}
.abas{display:flex;gap:8px;margin:0 0 20px}
.voltar{font:500 .85rem/1 var(--mono);text-decoration:none;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.pulso{animation:none}}
</style>
</head>
